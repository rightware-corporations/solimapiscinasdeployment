name: Frontend Refactor QA

on:
  push:
    branches:
      - refactor/v2-frontend-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-refactor-qa
  cancel-in-progress: true

jobs:
  frontend-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve Playwright browser path
        shell: bash
        run: |
          BROWSER_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath())")"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          echo "Using Playwright Chromium from a managed install."

      - name: JavaScript syntax checks
        id: syntax
        continue-on-error: true
        run: |
          node --check apps/web/js/app.js
          node --check apps/web/js/navigation.js
          node --check apps/web/js/capability.js
          node --check apps/web/js/hero-v2.js
          node --check apps/web/js/proof-v2.js
          node --check scripts/hero-v2-qa.mjs
          node --check scripts/proof-v2-qa.mjs

      - name: Hardened backend regression suite
        id: backend
        continue-on-error: true
        run: npm test

      - name: F3 Hero capability and viewport QA
        id: hero
        continue-on-error: true
        run: node scripts/hero-v2-qa.mjs

      - name: F4 Proof strip QA
        id: proof
        continue-on-error: true
        run: node scripts/proof-v2-qa.mjs

      - name: Existing visual QA — normal motion
        id: visual_normal
        continue-on-error: true
        run: npm run qa:normal

      - name: Existing visual QA — reduced motion
        id: visual_reduced
        continue-on-error: true
        run: npm run qa:reduced

      - name: Merge existing visual QA matrix
        id: visual_merge
        continue-on-error: true
        run: npm run qa:merge

      - name: Write auditable QA report
        if: always()
        shell: bash
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          HERO_OUTCOME: ${{ steps.hero.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          VISUAL_NORMAL_OUTCOME: ${{ steps.visual_normal.outcome }}
          VISUAL_REDUCED_OUTCOME: ${{ steps.visual_reduced.outcome }}
          VISUAL_MERGE_OUTCOME: ${{ steps.visual_merge.outcome }}
        run: |
          mkdir -p docs/architecture
          {
            echo "# Frontend Automated QA Result"
            echo
            echo "**Tested commit:** \`$GITHUB_SHA\`  "
            echo "**Runner:** GitHub Actions / Ubuntu / Node 22 / Playwright Chromium  "
            echo "**Generated:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| JavaScript syntax | $SYNTAX_OUTCOME |"
            echo "| Hardened backend regression | $BACKEND_OUTCOME |"
            echo "| F3 hero capability/viewports | $HERO_OUTCOME |"
            echo "| F4 proof strip | $PROOF_OUTCOME |"
            echo "| Existing visual QA normal | $VISUAL_NORMAL_OUTCOME |"
            echo "| Existing visual QA reduced | $VISUAL_REDUCED_OUTCOME |"
            echo "| Existing visual matrix merge | $VISUAL_MERGE_OUTCOME |"
            echo
            if [[ -f hero-report-f3/summary.json ]]; then
              echo "## Hero F3 summary"
              echo
              echo '```json'
              cat hero-report-f3/summary.json
              echo '```'
              echo
            fi
            if [[ -f visual-report-v2.1/matrix-summary.json ]]; then
              echo "## Existing visual matrix summary"
              echo
              echo '```json'
              cat visual-report-v2.1/matrix-summary.json
              echo '```'
              echo
            fi
            echo "This file is test evidence only. It does not deploy or change Railway."
          } > docs/architecture/FRONTEND-QA-AUTOMATED.md

      - name: Commit QA report to refactor branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/FRONTEND-QA-AUTOMATED.md
          if git diff --cached --quiet; then
            echo "No QA report change to commit."
          else
            git commit -m "test: record frontend automated QA"
            git push
          fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-refactor-qa-${{ github.sha }}
          path: |
            hero-report-f3
            visual-report-v2.1
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce QA gate
        if: always()
        shell: bash
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          HERO_OUTCOME: ${{ steps.hero.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          VISUAL_NORMAL_OUTCOME: ${{ steps.visual_normal.outcome }}
          VISUAL_REDUCED_OUTCOME: ${{ steps.visual_reduced.outcome }}
          VISUAL_MERGE_OUTCOME: ${{ steps.visual_merge.outcome }}
        run: |
          for outcome in \
            "$SYNTAX_OUTCOME" \
            "$BACKEND_OUTCOME" \
            "$HERO_OUTCOME" \
            "$PROOF_OUTCOME" \
            "$VISUAL_NORMAL_OUTCOME" \
            "$VISUAL_REDUCED_OUTCOME" \
            "$VISUAL_MERGE_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              echo "Frontend QA gate failed. See docs/architecture/FRONTEND-QA-AUTOMATED.md and workflow logs."
              exit 1
            fi
          done
          echo "Frontend QA gate passed."
